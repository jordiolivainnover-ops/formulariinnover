<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visites d’obra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f4f1;--surface:#fff;--ink:#1d2a2f;--muted:#5d6b70;--line:#d3d8d6;--accent:#1d5a73;--ok:#2d7a4d;--nok:#b23a2b;--na:#6b7478;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--surface:#1d2528;--ink:#e6ecee;--muted:#94a3a8;--line:#33403f;--accent:#6bb6d6;--ok:#58b883;--nok:#e2705f;--na:#98a4a8;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px}
h2{font-size:1.2rem;margin:0 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
input[type=text],input[type=date],input[type=time],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.item p{margin:0 0 6px;font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:inline-block;min-width:64px;text-align:center;padding:7px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:.9rem}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg input[value=OK]:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}
.seg input[value=NOK]:checked+span{background:var(--nok);border-color:var(--nok);color:#fff}
.seg input[value=NA]:checked+span{background:var(--na);border-color:var(--na);color:#fff}
.item input.note{margin-top:6px;display:none}
.item.show input.note{display:block}
.prog{font-size:.85rem;color:var(--muted);margin:-4px 0 8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.ph{position:relative}
.ph img{width:100%;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.ph button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.ph input{margin-top:4px;font-size:.8rem;padding:5px 6px}
canvas{width:100%;height:150px;background:var(--bg);border:1px dashed var(--line);border-radius:6px;touch-action:none;display:block}
button.b{font:inherit;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:9px 14px;cursor:pointer}
button.p{background:var(--accent);color:#fff}
:root:not([data-theme="light"]) button.p{color:#0b1417}
h3{background:linear-gradient(180deg,#6e851d,#24582a);color:#fff;font-size:1.1rem;margin:20px 0 4px;padding:9px 12px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}h3:first-child{margin-top:0}
.attach{position:relative;display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.9rem}.attach input{position:absolute;opacity:0;width:1px;height:1px}.attach:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.loc{display:flex;gap:6px}.loc button{white-space:nowrap;padding:6px 10px;font-size:.85rem}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
details{margin-top:6px}
pre{overflow-x:auto;font-size:.78rem;background:var(--bg);padding:10px;border-radius:6px;border:1px solid var(--line)}
.nc{margin:0 0 12px;padding-left:20px}.nc li{margin:3px 0}.nc li.empty{list-style:none;margin-left:-20px;color:var(--muted)}
.logo{display:inline-block;background:#fff;border-radius:8px;padding:6px 12px;margin:8px 0 4px}.logo img{display:block;height:auto;max-width:100%}
.msg{font-size:.85rem;color:var(--muted);min-height:1.2em;text-align:center}
</style>
</head>
<body>
<main>
<div class="logo"><img id="logo" alt="Estabanell Innover" width="200"></div>
<h1>Visita d’obra · Instal·lació fotovoltaica</h1>
<p class="sub">Omple la visita i envia-la a monday. També pots descarregar l’informe en PDF.</p>

<section><h2>Dades de la visita</h2>
<div class="grid">
<label class="f">Projecte / instal·lació<input type="text" id="proyecto" placeholder="Escriu el nom de l’obra"></label>
<label class="f">Ubicació<span class="loc"><input type="text" id="ubicacion" placeholder="Cercant la ubicació…"><button class="b" type="button" id="geo">Actualitzar</button></span></label>
<label class="f">Data<input type="date" id="fecha"></label>
<label class="f">Motiu de la visita<select id="motiu"><option value="">Selecciona…</option><option>Inici d’obra</option><option>Seguiment d’obra</option><option>Fi d’obra</option></select></label>

<label class="f">Enginyer/a<select id="ingeniero"><option value="">Selecciona…</option><option>Eva</option><option>Víctor</option><option>Marc</option><option>Jordi</option></select></label>
<label class="f">Cap d’equip<select id="jefe"><option value="">Selecciona…</option><option>Guifré Caball</option><option>Marcos Rodríguez</option><option>Marc Pérez</option><option>Toni Haro</option><option>Marc Jené</option></select></label>
<label class="f">Fase d’obra<select id="fase"><option>Estructura</option><option>Cablejat, canals i terres</option><option>Muntatge de mòduls</option><option>Inversors i proteccions</option><option>Posada en marxa</option></select></label>
<label class="f">Meteorologia<select id="meteo"><option>Serè</option><option>Ennuvolat</option><option>Pluja</option><option>Vent fort</option></select></label>
</div></section>

<section><h2>Comprovació del muntatge</h2>
<p class="prog" id="prog"></p>
<div id="check"></div></section>

<section><h2>Observacions i no conformitats</h2>
<ul class="nc" id="nc"></ul>
<textarea id="obs" placeholder="Altres observacions, acords amb el cap d’equip, accions pendents…"></textarea></section>



<section><h2>Signatura de l’enginyer/a</h2>
<canvas id="sig" width="700" height="200"></canvas>
<p style="margin:8px 0 0"><button class="b" id="clr" type="button">Esborrar signatura</button></p></section>

<section><h2>Signatura del cap d’equip</h2>
<canvas id="sig2" width="700" height="200"></canvas>
<p style="margin:8px 0 0"><button class="b" id="clr2" type="button">Esborrar signatura</button></p></section>

</main>

<div class="bar"><div class="msg" id="msg" style="width:100%"></div>
<button class="b" id="draft" type="button">Desar esborrany</button>
<button class="b" id="reset" type="button">Nova visita</button>
<button class="b" id="gen" type="button">Descarregar PDF</button>
<button class="b p" id="send" type="button">Enviar a monday</button></div>

const GROUPS=[
["Estructura",["Replanteig conforme plànols","Separació respecte lluernaris, sectors i passadissos","Alineació d’estructura","Parell de força","Elements d’unió","Juntes de dilatació"],"Fotos estructura"],
["Cable CC",["Cablejat de CC sense tocar a terra","Connectors MC4 embridats al marc del panell","Sèries embridades, sense radis de curvatura excessius, fora d’arestes vives o zones d’acumulació d’aigua","Sèries identificades","Secció cable solar segons projecte"],"Fotos cablejat"],
["Canalitzacions",["Alineació i recorregut segons projecte","Subjecció","Dimensió adequada"],"Fotos canalitzacions"],
["Posada a terra",["Estructura","Panells","Canals"],"Fotos posada a terra"],
["Panells",["Subjecció segons manual de muntatge","Alineació del camp solar"],"Fotos panells"],
["Baixada CC",["Entrada a la nau segons acordat","Recorregut segons projecte","Canalitzacions adequades"],"Fotos baixada CC"],
["Inversors",["Inversors i cables identificats","Ubicació i replanteig segons projecte","Ventilació i distàncies de seguretat adequades","Secció dels circuits i curvatures adequades","Cables de monitorització correctes i separats de la potència"],"Fotos inversors"],
["Quadres",["Quadres i circuits identificats","Segellament dels quadres i canals","Ubicació i replanteig segons projecte","Distàncies adequades","Secció dels circuits i curvatures adequades"],"Fotos quadres"],
["Connexió",["Ubicació segons acordat","Lectura de consum correcta"],"Fotos connexió"],
["Ordre i neteja",["Material emmagatzemat on pertoca","Obra ordenada i neta","Residus segregats i gestionats"],"Fotos ordre i neteja"]];
const ITEMS=[];GROUPS.forEach(g=>g[1].forEach(s=>ITEMS.push([g[0],s])));
const $=id=>document.getElementById(id);
$("logo").src=LOGO;
const st={fotos:[],sig:false,gf:GROUPS.map(()=>[])};
const FIELDS=["proyecto","ubicacion","fecha","motiu","ingeniero","jefe","fase","meteo","obs"];
const KEY="visita-obra-draft-v2";

// checklist
let k=0;
$("check").innerHTML=GROUPS.map((g,gi)=>`<h3>${g[0]}</h3>`+g[1].map(s=>{const i=k++;return `<div class="item" id="it${i}"><p>${s}</p>
<div class="seg">${["OK","NOK","NA"].map(v=>`<label><input type="radio" name="c${i}" value="${v}"><span>${v==="NA"?"N/A":v==="NOK"?"NO-OK":v}</span></label>`).join("")}</div>
<input type="text" class="note" id="n${i}" placeholder="Descriu la incidència"></div>`}).join("")+`<div class="item"><p>${g[2]}</p><label class="attach">Afegir fotos<input type="file" accept="image/*" multiple data-g="${gi}"></label><div class="photos" id="gp${gi}"></div></div>`).join("");
document.querySelectorAll("input[data-g]").forEach(inp=>inp.addEventListener("change",async()=>{const g=+inp.dataset.g,fs=[...inp.files];for(const f of fs)st.gf[g].push({data:await shrink(f),pie:""});inp.value="";drawGP(g);upd()}));
document.querySelectorAll("#check input[type=radio]").forEach(r=>r.addEventListener("change",()=>{upd();}));
document.querySelectorAll("#check .note").forEach(n=>n.addEventListener("input",upd));
FIELDS.forEach(f=>$(f).addEventListener("input",upd));
$("fecha").value=new Date().toISOString().slice(0,10);

function collect(){
 const d={};FIELDS.forEach(f=>d[f]=$(f).value);
 d.checklist=ITEMS.map((it,i)=>{const r=document.querySelector(`input[name=c${i}]:checked`);return{punto:it[0],sub:it[1],estado:r?r.value:"",nota:$("n"+i).value}});
 d.fotosApartats=GROUPS.map((g,gi)=>({apartat:g[2],n:st.gf[gi].length}));
 return d;
}
function upd(){
 ITEMS.forEach((_,i)=>{const r=document.querySelector(`input[name=c${i}]:checked`);$("it"+i).classList.toggle("show",!!r&&r.value==="NOK")});
 const d=collect(),done=d.checklist.filter(c=>c.estado).length,nok=d.checklist.filter(c=>c.estado==="NOK").length;
 $("prog").textContent=`${done} de ${ITEMS.length} punts revisats · ${nok} amb incidència`;
 const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
 const ncs=d.checklist.filter(c=>c.estado==="NOK");
 $("nc").innerHTML=ncs.length?ncs.map(c=>`<li><b>${esc(c.punto)}</b>: ${esc(c.sub)}${c.nota?`. Incidència: ${esc(c.nota)}`:""}</li>`).join(""):`<li class="empty">Cap no conformitat de moment.</li>`;
}

// fotos

function shrink(file){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");
 c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 URL.revokeObjectURL(u);res({url:c.toDataURL("image/jpeg",.7),w:c.width,h:c.height})};img.src=u;});}
function drawGP(g){const el=$("gp"+g);el.innerHTML="";st.gf[g].forEach((f,i)=>{const d=document.createElement("div");d.className="ph";d.innerHTML=`<img src="${f.data.url}" alt="Foto ${i+1}"><button type="button" aria-label="Treure la foto">×</button><input type="text" placeholder="Peu de foto">`;d.querySelector("button").onclick=()=>{st.gf[g].splice(i,1);drawGP(g);upd()};d.querySelector("input").value=f.pie;d.querySelector("input").oninput=e=>{f.pie=e.target.value};el.appendChild(d)})}


// firma
const cv=$("sig"),cx=cv.getContext("2d");let dr=false;
cx.lineWidth=2.5;cx.lineCap="round";cx.strokeStyle="#000";
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
cv.addEventListener("pointerdown",e=>{dr=true;cv.setPointerCapture(e.pointerId);const[x,y]=pos(e);cx.beginPath();cx.moveTo(x,y)});
cv.addEventListener("pointermove",e=>{if(!dr)return;const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke();st.sig=true});
cv.addEventListener("pointerup",()=>dr=false);
$("clr").onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);st.sig=false};
function pad(cid,bid,key){const c=$(cid),x=c.getContext("2d");let on=false;x.lineWidth=2.5;x.lineCap="round";x.strokeStyle="#000";const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.addEventListener("pointerdown",e=>{on=true;c.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)});c.addEventListener("pointermove",e=>{if(!on)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke();st[key]=true});c.addEventListener("pointerup",()=>on=false);$(bid).onclick=()=>{x.clearRect(0,0,c.width,c.height);st[key]=false}}
pad("sig2","clr2","sig2");

// borrador
function msg(t){$("msg").textContent=t;setTimeout(()=>{if($("msg").textContent===t)$("msg").textContent=""},3500)}
$("draft").onclick=()=>{try{const d=collect();d.raw=Object.fromEntries(FIELDS.map(f=>[f,$(f).value]));d.estados=d.checklist;localStorage.setItem(KEY,JSON.stringify({raw:d.raw,estados:d.estados}));msg("Esborrany desat (sense fotos ni signatura).")}catch(e){msg("No s’ha pogut desar l’esborrany.")}};
$("reset").onclick=()=>{if(confirm("Vols començar una visita nova? S’esborraran les dades actuals.")){location.reload()}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s){FIELDS.forEach(f=>{if(s.raw[f]!==undefined)$(f).value=s.raw[f]});
 s.estados.forEach((c,i)=>{if(c.estado){const r=document.querySelector(`input[name=c${i}][value=${c.estado}]`);if(r)r.checked=true}$("n"+i).value=c.nota||""})}}catch(e){}
upd();

// ubicació en directe
function geo(){
 const u=$("ubicacion");
 if(!navigator.geolocation){u.placeholder="Aquest dispositiu no permet obtenir la ubicació. Escriu-la a mà.";return}
 u.placeholder="Cercant la ubicació…";
 navigator.geolocation.getCurrentPosition(p=>{u.value=p.coords.latitude.toFixed(5)+", "+p.coords.longitude.toFixed(5);upd()},()=>{u.placeholder="No s’ha pogut obtenir. Permet l’accés a la ubicació o escriu-la a mà."},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
$("geo").onclick=geo;geo();

// PDF
async function buildPdf(){
 const d=collect();
 if(!d.proyecto){msg("Escriu el nom del projecte abans de continuar.");$("proyecto").focus();return null}
 const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),M=15,W=180,CX=[M,M+135,M+150,M+165];
 const T=s=>String(s||"").replace(/\u2019/g,"'");
 const G=[60,99,42],LINE=[196,203,199],GREY=[238,241,239];
 const fc=c=>doc.setFillColor(c[0],c[1],c[2]),tc=c=>doc.setTextColor(c[0],c[1],c[2]),dc=c=>doc.setDrawColor(c[0],c[1],c[2]);
 const F=(st2,sz)=>{doc.setFont("helvetica",st2);doc.setFontSize(sz)};
 let y=15;
 const nl=h=>{if(y+h>282){doc.addPage();y=18}};
 doc.setLineWidth(.2);dc(LINE);
 const lw=46,lh=lw*0.34;
 doc.addImage(LOGO,"JPEG",M,y,lw,lh);
 F("bold",17);tc([30,30,30]);doc.text("Informe de visita d'obra",M+W,y+7,{align:"right"});
 F("normal",10);tc([90,90,90]);doc.text("Instal\u00b7laci\u00f3 fotovoltaica",M+W,y+13,{align:"right"});
 y+=lh+3;dc(G);doc.setLineWidth(.9);doc.line(M,y,M+W,y);doc.setLineWidth(.2);dc(LINE);y+=6;
 const fd=d.fecha?d.fecha.split("-").reverse().join("/"):"";
 const cell=(lab,val,x,w)=>{fc(GREY);doc.rect(x,y,30,7,"FD");doc.rect(x+30,y,w-30,7);F("bold",8.5);tc([60,60,60]);doc.text(lab,x+2,y+4.7);F("normal",9.5);tc([20,20,20]);doc.text(doc.splitTextToSize(T(val)||"-",w-34)[0],x+32,y+4.7)};
 cell("Projecte",d.proyecto,M,W);y+=7;
 cell("Ubicaci\u00f3",d.ubicacion,M,W);y+=7;
 cell("Data",fd,M,90);cell("Motiu",d.motiu,M+90,90);y+=7;
 cell("Enginyer/a",d.ingeniero,M,90);cell("Cap d'equip",d.jefe,M+90,90);y+=7;
 cell("Fase d'obra",d.fase,M,90);cell("Meteorologia",d.meteo,M+90,90);y+=7;
 const sect=t=>{nl(18);y+=7;F("bold",13);tc(G);doc.text(t,M,y);y+=3};
 sect("COMPROVACI\u00d3 DEL MUNTATGE");
 GROUPS.forEach((g,gi)=>{
  nl(24);y+=2;
  fc(G);doc.rect(M,y,W,8,"F");tc([255,255,255]);F("bold",10.5);doc.text(g[0].toUpperCase(),M+2,y+5.6);
  F("bold",8);["OK","NO-OK","N/A"].forEach((t,i)=>doc.text(t,CX[i+1]+7.5,y+5.4,{align:"center"}));y+=8;
  d.checklist.filter(c=>c.punto===g[0]).forEach(c=>{
   const sl=doc.splitTextToSize(T(c.sub),129),h=Math.max(7,sl.length*4.4+2.6);
   nl(h);dc(LINE);doc.rect(M,y,135,h);F("normal",9.5);tc([30,30,30]);doc.text(sl,M+2,y+4.8);
   ["OK","NOK","NA"].forEach((v,i)=>{const sel=c.estado===v,x=CX[i+1];
    if(sel){fc(v==="OK"?[222,240,226]:v==="NOK"?[250,224,220]:[232,234,235]);doc.rect(x,y,15,h,"FD");tc(v==="OK"?[40,120,60]:v==="NOK"?[178,58,43]:[107,116,120]);F("bold",11);doc.text("X",x+7.5,y+h/2+1.6,{align:"center"})}
    else doc.rect(x,y,15,h)});
   y+=h;
   if(c.estado==="NOK"&&c.nota){const nn=doc.splitTextToSize("Incid\u00e8ncia: "+T(c.nota),W-4),hh=nn.length*4.4+3;nl(hh);fc([252,238,235]);dc(LINE);doc.rect(M,y,W,hh,"FD");tc([150,40,30]);F("normal",9);doc.text(nn,M+2,y+4.6);y+=hh}
  });
  const fs=st.gf[gi];
  if(fs.length){
   nl(14);fc(GREY);dc(LINE);doc.rect(M,y,W,6.5,"FD");tc([60,60,60]);F("bold",8.5);doc.text(T(g[2]),M+2,y+4.5);y+=6.5;
   for(let i=0;i<fs.length;i+=2){
    const row=fs.slice(i,i+2),dm=row.map(f=>{const s=Math.min(84/f.data.w,66/f.data.h);return[f.data.w*s,f.data.h*s]}),rh=Math.max(...dm.map(a=>a[1]))+10;
    nl(rh);dc(LINE);doc.rect(M,y,W,rh);
    row.forEach((f,j)=>{const x=M+3+j*90;doc.addImage(f.data.url,"JPEG",x,y+3,dm[j][0],dm[j][1]);if(f.pie){F("normal",8);tc([70,70,70]);doc.text(T(f.pie),x,y+dm[j][1]+7,{maxWidth:84})}});
    y+=rh}
  }
 });
 sect("OBSERVACIONS I NO CONFORMITATS");y+=2;
 const nc=d.checklist.filter(c=>c.estado==="NOK"),cx=[M,M+40,M+110],cw=[40,70,70];
 nl(20);["Secci\u00f3","Punt de control","Incid\u00e8ncia"].forEach((t,i)=>{fc(GREY);dc(LINE);doc.rect(cx[i],y,cw[i],7,"FD");F("bold",8.5);tc([60,60,60]);doc.text(t,cx[i]+2,y+4.7)});y+=7;
 if(!nc.length){dc(LINE);doc.rect(M,y,W,7);F("normal",9.5);tc([90,90,90]);doc.text("Cap no conformitat registrada.",M+2,y+4.8);y+=7}
 nc.forEach(c=>{const cl=[T(c.punto),T(c.sub),T(c.nota)||"-"].map((t,i)=>doc.splitTextToSize(t,cw[i]-4)),h=Math.max(7,Math.max(...cl.map(a=>a.length))*4.4+2.6);nl(h);cl.forEach((ln,i)=>{dc(LINE);doc.rect(cx[i],y,cw[i],h);F("normal",9);tc([30,30,30]);doc.text(ln,cx[i]+2,y+4.8)});y+=h});
 if(d.obs){y+=4;nl(24);fc(GREY);dc(LINE);doc.rect(M,y,W,7,"FD");F("bold",8.5);tc([60,60,60]);doc.text("Altres observacions",M+2,y+4.7);y+=7;
  const ol=doc.splitTextToSize(T(d.obs),W-4),h=ol.length*4.4+3;nl(Math.min(h,60));doc.rect(M,y,W,h);F("normal",9.5);tc([30,30,30]);doc.text(ol,M+2,y+5);y+=h}
 y+=8;nl(42);
 const sg=(cn,x,yy)=>{const c=document.createElement("canvas");c.width=cn.width;c.height=cn.height;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(cn,0,0);doc.addImage(c.toDataURL("image/jpeg",.8),"JPEG",x,yy,60,17)};
 [["Signatura enginyer/a",d.ingeniero,st.sig,cv],["Signatura cap d'equip",d.jefe,st.sig2,$("sig2")]].forEach((s,i)=>{const x=M+i*92;fc(GREY);dc(LINE);doc.rect(x,y,88,7,"FD");F("bold",8.5);tc([60,60,60]);doc.text(s[0].toUpperCase(),x+2,y+4.7);doc.rect(x,y+7,88,28);if(s[2])sg(s[3],x+2,y+9);F("normal",9.5);tc([30,30,30]);doc.text(T(s[1]),x+2,y+32.5)});
 const n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);F("normal",8);tc([120,120,120]);doc.text(`P\u00e0gina ${p} de ${n}`,105,291,{align:"center"})}
 const fname=`visita-${d.proyecto.replace(/\W+/g,"-")}-${d.fecha}.pdf`;
 return {doc,fname,d};
}

$("gen").onclick=async()=>{const r=await buildPdf();if(!r)return;r.doc.save(r.fname);msg("PDF descarregat.")};

$("send").onclick=async()=>{
 const r=await buildPdf();if(!r)return;
 const b=$("send");b.disabled=true;msg("Enviant a monday…");
 try{
  const nc=r.d.checklist.filter(c=>c.estado==="NOK");
  const dades={projecte:r.d.proyecto,ubicacio:r.d.ubicacion,data:r.d.fecha,motiu:r.d.motiu,enginyer:r.d.ingeniero,cap_equip:r.d.jefe,fase:r.d.fase,meteo:r.d.meteo,observacions:r.d.obs,n_no_conformitats:nc.length,no_conformitats:nc.map(c=>c.punto+": "+c.sub+(c.nota?" - "+c.nota:"")).join("\n")};
  const pdf=r.doc.output("datauristring").split(",")[1];
  const res=await fetch("/api/visites",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dades,fitxer:r.fname,pdf})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(j.error||("Error "+res.status));
  msg("Visita enviada a monday correctament.");
 }catch(e){msg("No s’ha pogut enviar: "+e.message)}
 b.disabled=false;
};

</script>
